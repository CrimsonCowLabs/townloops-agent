[pytest]
# The repo root is the import root — engine/, skills/business/... all live
# beneath it. testpaths and pythonpath together let `pytest` be run from
# anywhere and still discover the modules under test.
testpaths = tests
pythonpath = .

# Failed assertions get a full diff regardless of length.
addopts = -ra --strict-markers --tb=short

# All markers used in the suite. Adding a new one? Register it here — the
# strict-markers option turns typos into hard errors, not silent skips.
markers =
    slow: tests that hit the disk or fork (>50ms)
    integration: tests that touch a real network endpoint (skipped by default in CI)

# LEGACY — the hand-written allowlist, superseded by the generated
# $TOWNLOOPS_AGENTS_ROOT/_egress/squid.conf (bin/townloops-agent-add --egress).
# Kept only so a squid-egress container created before that change, which
# still bind-mounts this file, keeps working until it is recreated with
# `docker compose -f templates/_shared/egress/docker-compose.yml up -d`.
# Don't edit it; don't add hosts here.
#
# Squid egress allowlist for townloops-agent (autonomous / YOLO mode).
# Only CONNECT to hosts on this allowlist succeeds; everything else 403.
#
# Add per-town discovery seeds by extending `allowed_hosts` in each town's
# town-profile.yaml and re-generating this file via a follow-up tool (or
# manually append here).

http_port 3128

# --- destination allowlist ---------------------------------------------

acl anthropic     dstdomain .anthropic.com
acl openai        dstdomain .openai.com
acl chatgpt       dstdomain .chatgpt.com
acl townloops     dstdomain .townloops.com
acl telegram      dstdomain .telegram.org
acl listmonk_lan  dstdomain host.docker.internal

# Common TownLoops-content sources — the per-town allowlist should extend
# these as needed. Broad enough to cover typical discovery targets:
acl news_sites    dstdomain .visitlaketahoe.com .tahoechamber.org

# north-shore town (Lake Tahoe, CA + NV). Starter set of confirmed-real
# hosts — grow this list from live squid 403s during launch week.
acl tahoe_north   dstdomain \
    .gotahoenorth.com .visitrenotahoe.com \
    .washoecounty.gov .placer.ca.gov \
    .ivgid.org \
    .tahoedailytribune.com .sierrasun.com \
    .eventbrite.com

# slt town (South Lake Tahoe, CA + Stateline, NV). Hosts of the SLT event
# seeds (approved + proposed) at the profile → docker move, 2026-10-08.
acl tahoe_south   dstdomain \
    .cityofslt.us .cityofslt.gov .southtahoenow.com .trpa.gov \
    .apeconcerts.com .bigblueadventure.com .bluegraniteclimbing.com \
    .camprichardsonresort.com .caesars.com .ballys.com \
    .engagedpatrons.org .laketahoemarathon.com .laketahoeshakespeare.com \
    .ltcc.edu .samplethesierra.com .sierrastateparks.org \
    .tahoeblueeventcenter.com .tahoebrewfest.com .theshopsatheavenly.com \
    .showare.com

# Also allow direct connection to any registered facebook.com host for
# social-signal discovery (community-discovery / facebook source).
acl facebook      dstdomain .facebook.com

# --- CONNECT (HTTPS) restricted to safe-ish ports ----------------------
acl SSL_ports     port 443
acl Safe_ports    port 80 443 8080
acl CONNECT method CONNECT

http_access deny  !Safe_ports
http_access deny  CONNECT !SSL_ports

# --- Deny by default; only listed dstdomains pass. ---------------------

http_access allow anthropic
http_access allow openai
http_access allow chatgpt
http_access allow townloops
http_access allow telegram
http_access allow listmonk_lan
http_access allow news_sites
http_access allow tahoe_north
http_access allow tahoe_south
http_access allow facebook

http_access deny  all

# --- Access logging ----------------------------------------------------
# Un-silenced during north-shore launch week so 403s are visible.
# Default path is inside the container at /var/log/squid/access.log —
# tail with `docker exec squid-egress tail -f /var/log/squid/access.log`.
# Restore `access_log none` once discovery is stable to reduce noise.
access_log daemon:/var/log/squid/access.log squid
cache deny all

# Don't retain X-Forwarded-For (agents behind this proxy should be opaque
# to the destination).
forwarded_for delete
via off

# Per-town profile — read by the discovery skills and the orchestrator.
# Place at ~/townloops-agents/{slug}/town-profile.yaml.

slug:   "{{SLUG}}"
name:   "PLACEHOLDER — the town's display name, e.g. \"South Lake Tahoe\""
region: "PLACEHOLDER — state/province, e.g. \"California\""

# Hosts this town's agent may reach directly through the shared Squid egress
# proxy (each entry also allows its subdomains). Compiled into
# templates/_shared/egress/squid.conf by `bin/townloops-agent-add --egress`,
# then `docker exec squid-egress squid -k reconfigure`. Bare hostnames only —
# "example.org", not "https://example.org/events" (that's an error).
# Firecrawl scrapes don't go through Squid, so seeds scraped that way don't
# need listing. Add carefully — every entry is an implicit trust decision.
allowed_hosts:
  - "example-chamber.org"
  - "visitexample.com"

discovery:
  # Business sweeps: category-based web-search + directory scrapes.
  business:
    # Free-form terms fanned out as `{term} in {name}, {region}` /
    # `best {term} {name}` / `local {term} {name}`. Draw from the
    # town's live business categories, adjusted for local vocab.
    category_query_terms:
      - "restaurants"
      - "coffee shops"
      - "outfitters"
      - "boutiques"
    # Seed directory pages whose outbound links are candidate businesses.
    # Blocked link classes (site utilities, PDFs, generic section pages)
    # are filtered by engine/discovery.directory_link_block_reason.
    seed_directories:
      - "https://visitexample.com/things-to-do/"
    # Optional Facebook page search — `site:facebook.com "{town}" {term}`.
    # Comment out to skip the Facebook source entirely.
    # facebook_terms: ["cafe", "brewery"]

  # Community sweeps: nonprofit + city gov + civic-org fanout.
  # Each query_group's terms are tagged with the group's category_slug so
  # the promotion step files each candidate under the right category. The
  # slugs must exist in the town's live categories snapshot (municipal,
  # nonprofit, community-group, …) — see engine/policy.has_category.
  community:
    query_groups:
      - category_slug: "municipal"
        terms:
          - "city government"
          - "town hall"
          - "city council"
          - "chamber of commerce"
      - category_slug: "nonprofit"
        terms:
          - "nonprofit organizations"
          - "501c3"
          - "foundation"
      - category_slug: "community-group"
        terms:
          - "civic organizations"
          - "community association"
    seed_directories: []

# Optional overrides for engine/policy caps. Omit for defaults
# (businesses=30/day, venues=15, communities=15, performers=15, creators=15).
# post_caps:
#   businesses: 20
#   communities: 10

# Optional source-health alert tuning (engine/source_health.py). An approved
# seed whose latest successful event-find lists 0 events, or under
# (100 - drop_pct)% of its trailing average, alerts the operator once
# (Telegram + dashboard). Omit for defaults.
# source_health:
#   window: 6          # trailing successful runs averaged
#   min_runs: 3        # runs needed before a seed is judged
#   drop_pct: 50       # % drop vs the average that alerts
#   min_baseline: 4    # seeds averaging fewer events only alert on zero

# Workqueue drain (engine/orchestrator.drain_settings). The 10-min heartbeat
# runs detached, bounded by these; read on every drain. Detail-page reads
# (Firecrawl + Codex, ~100s worst case) start only in the first half of the
# budget; no skill starts once it is spent. workqueue_rate_limits (hourly,
# per action; read-detail defaults to 30) still bound every claim.
# workqueue_drain:
#   read_detail_per_drain: 6   # 1–20
#   budget_seconds: 420        # 60–660; keep budget + 120s under the 10-min tick
# workqueue_rate_limits:
#   read-detail: 30

# Operating mode (engine/autonomy.py). `supervised` (the default) is the
# operator-gated pipeline: seeds, events, business candidates and
# cancellations wait for approval in the local dashboard. `autonomous`
# makes those calls in the agent — judging every extracted event, trialling
# and retiring seeds, harvesting organisations — and submits everything to
# TownLoops through an `api_ingest` key with NO publish permission, so it
# lands `pending` in the TownLoops admin moderation queue: that is the only
# human gate. A create that comes back `published` stops all submissions
# (fail closed). The dashboard isn't run for an autonomous town (see the
# compose `dashboard` profile); the nightly Telegram digest and
# `autonomy why <id>` are the operator surfaces. Read on every cron run.
# operating_mode: autonomous
# autonomy:
#   paused: false              # true stops submissions at once (collecting goes on)
#   entity_moderation: true    # new venues, hosts and organisations are submitted
#                              # pending (TownLoops entity gate); false holds them and
#                              # events ship with the venue's name for the curate-venue flow
#   max_pending: 100           # cap on our submissions pending in TownLoops at once
#   horizon_days: 120          # events further out are dropped
#   circuit_breaker:           # stop submitting when the moderator rejects too much
#     reject_rate: 0.5         #   rejected share of …
#     window: 20               #   … the last N decided submissions,
#     min_outcomes: 10         #   once at least this many are decided
#   seed_retirement:
#     min_runs: 4              # runs before a seed is judged at all
#     dead_runs: 4             # consecutive failed/empty runs (or runs under a health
#                              # alert) → look for a moved calendar, else retire
#     min_outcomes: 5          # decided submissions before trust demotes or retires a seed
#   seed_trust:                # trust 0..1: moderator-published share since the seed's last
#                              # status change (a new seed starts at 0.5), scaled down by a
#                              # health alert and dedup losses; a trial's score is the
#                              # smoothed share of its listed events that passed judgement
#     approve: 0.2             # a proposed seed's trial must score this (and pass ≥1 event)
#     syndicator: 0.45         # below this an approved seed is demoted to syndicator
#     retire: 0.3              # below this it is retired (re-probed first under a health alert)
#   series_reject_streak: 3    # a Series rejected this many times in a row is skipped
#                              # until one of its submissions is published
#   series_publish_streak: 3   # a Series published this many times in a row is well
#                              # established: new occurrences skip the AI judgement (0 = off)
#   stuck_retries: 2           # backoff retries (1h, 2h) before a stuck event ships
#                              # with what it has, or is dropped
# zip_codes: ["96150"]         # optional: a listed ZIP outside these is out of town

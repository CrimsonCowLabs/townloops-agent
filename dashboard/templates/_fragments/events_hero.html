<section id="frag-events-hero" class="events-hero live-widget"
         hx-get="/fragments/events/hero-count"
         hx-trigger="every 10s"
         hx-swap="outerHTML">
  <h2>Events</h2>
  <div class="hero-row">
    <div class="hero-stat">
      <p class="hero-num">{{ events.total }}</p>
      <p class="muted">total</p>
    </div>
    <div class="hero-stat">
      <p class="hero-num">{{ events.upcoming }}</p>
      <p class="muted">upcoming</p>
    </div>
    <div class="hero-stat">
      <p class="hero-num">{{ events.shipped }}</p>
      <p class="muted">shipped to TownLoops</p>
    </div>
  </div>
</section>
